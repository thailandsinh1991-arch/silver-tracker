<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column app shell (max 760px). Bottom tab bar on phones, sticky top tabs on desktop.
   Palette follows the existing Silver Tracker app: deep navy ground, green for "thu mua"/gains. */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #e9edf4;
  --line: #d5dce7;
  --fg: #0f172a;
  --muted: #586378;
  --accent: #15803d;
  --accent-ink: #ffffff;
  --up: #15803d;
  --down: #c62828;
  --warn: #a15c07;
  --silver: #334155;
  --shadow: 0 10px 30px rgba(15, 23, 42, .12);
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a; --surface: #18233d; --surface-2: #1e2d47; --line: #263553;
    --fg: #f1f5f9; --muted: #94a3b8; --accent: #4ade80; --accent-ink: #0b1a12;
    --up: #4ade80; --down: #f87171; --warn: #fbbf24; --silver: #cbd5e1;
    --shadow: 0 12px 34px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a; --surface: #18233d; --surface-2: #1e2d47; --line: #263553;
  --fg: #f1f5f9; --muted: #94a3b8; --accent: #4ade80; --accent-ink: #0b1a12;
  --up: #4ade80; --down: #f87171; --warn: #fbbf24; --silver: #cbd5e1;
  --shadow: 0 12px 34px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(145deg, #e2e8f0, #94a3b8 55%, #e2e8f0); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); display: grid; place-items: center; font: 600 11px var(--font-num); color: #1e293b; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 11px; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 500; border-radius: 10px; }
.tab svg { width: 21px; height: 21px; }
.tab[aria-selected="true"] { color: var(--accent); }
@media (min-width: 820px) {
  .app { padding-block: 26px 48px; }
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; display: flex; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 5px; margin-bottom: 18px; }
  .tab { flex-direction: row; gap: 8px; padding: 8px 14px; font-size: 13px; }
  .tab svg { width: 17px; height: 17px; }
  .tab[aria-selected="true"] { background: var(--surface-2); }
}

h2.page { margin: 0 0 2px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.lede { margin: 0 0 16px; color: var(--muted); font-size: 12.5px; }
.stack { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.eyebrow { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row > * { min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 11.5px; }
.tiny { font-size: 10.5px; }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }

/* status line */
.hdr-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.acct { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); font-size: 11.5px; font-weight: 600; color: inherit; }
.acct.on { padding: 0; width: 30px; justify-content: center; background: var(--accent); color: var(--accent-ink); border-color: transparent; font-size: 13px; }
.acct img { width: 30px; height: 30px; border-radius: 50%; display: block; }
.status { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--up); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--down); }

/* market hero */
.quote { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.quote > div { background: var(--surface-2); border-radius: 12px; padding: 12px; min-width: 0; }
.quote .label { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; }
.quote .val { font-family: var(--font-num); font-size: clamp(19px, 5.4vw, 26px); font-weight: 600; margin-top: 4px; letter-spacing: -.02em; }
.quote .hint { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.spread { margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.card.world { padding: 18px; }
.world-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.world-usd { font-size: clamp(40px, 12vw, 58px); font-weight: 600; letter-spacing: -.04em; line-height: 1; color: var(--silver); }
.world-unit { font-size: 15px; color: var(--muted); font-weight: 500; }
.world-vnd { margin-top: 8px; font-size: clamp(18px, 5vw, 22px); font-weight: 600; }
.spark { width: 100%; height: 64px; display: block; margin-top: 12px; }
.spark-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }

.table-wrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; min-width: 420px; }
th, td { text-align: left; padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }
td .pname { font-weight: 600; font-size: 12px; }

/* portfolio card */
.pf-value { font-family: var(--font-num); font-size: clamp(26px, 7vw, 34px); font-weight: 600; letter-spacing: -.03em; margin-top: 6px; }
.pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.pf-grid .k { font-size: 10.5px; color: var(--muted); }
.pf-grid .v { font-family: var(--font-num); font-size: 15px; font-weight: 600; margin-top: 2px; }
.pf-grid .s { font-size: 10.5px; margin-top: 1px; }
.metrics { display: grid; gap: 9px; }
.metrics .row .v { font-family: var(--font-num); font-weight: 600; font-size: 12.5px; text-align: right; flex: none; }
.metrics .row .k { color: var(--muted); font-size: 12px; }
.bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }

.notice { display: flex; gap: 9px; align-items: flex-start; padding: 11px 12px; border-radius: 11px; font-size: 12px; line-height: 1.45; }
.notice svg { flex: none; width: 16px; height: 16px; margin-top: 1px; }
.notice.err { border: 1px solid color-mix(in srgb, var(--down) 50%, transparent); color: var(--down); }
.notice.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--fg); }
.notice.warn svg { color: var(--warn); }
.notice.info { background: var(--surface-2); color: var(--fg); }
.notice .grow { flex: 1; min-width: 0; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 9px 13px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--down); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: none; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* transactions */
.tx-list { display: grid; gap: 9px; }
.tx { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 12px 13px; }
.tx:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.tx-head { display: flex; align-items: center; gap: 8px; }
.badge { font-size: 9px; font-weight: 700; letter-spacing: .06em; padding: 3px 6px; border-radius: 5px; }
.badge.buy { color: var(--up); background: color-mix(in srgb, var(--up) 15%, transparent); }
.badge.sell { color: var(--down); background: color-mix(in srgb, var(--down) 15%, transparent); }
.tx-date { font-size: 11px; color: var(--muted); }
.tx-name { font-weight: 600; font-size: 13px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12px; }
.tx-meta .amt { font-family: var(--font-num); font-weight: 600; flex: none; }
.tx-sub { margin-top: 4px; font-size: 10.5px; color: var(--muted); }
.tx.gain { box-shadow: inset 3px 0 0 var(--up); }
.tx.loss { box-shadow: inset 3px 0 0 var(--down); }
.pl-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 11px; }
.pl-row .pl-val { font-family: var(--font-num); font-weight: 600; font-size: 12.5px; }
.pl-chip { font-family: var(--font-num); font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.pl-chip.up { background: color-mix(in srgb, var(--up) 16%, transparent); }
.pl-chip.down { background: color-mix(in srgb, var(--down) 16%, transparent); }
.card.pf-up { border-color: color-mix(in srgb, var(--up) 55%, var(--line)); background: color-mix(in srgb, var(--up) 7%, var(--surface)); }
.card.pf-down { border-color: color-mix(in srgb, var(--down) 55%, var(--line)); background: color-mix(in srgb, var(--down) 7%, var(--surface)); }
.pl-big { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.pl-big .amt { font-family: var(--font-num); font-weight: 600; font-size: 16px; }
.tx-note { margin-top: 5px; font-size: 11px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }

.empty { text-align: center; padding: 30px 16px; display: grid; gap: 8px; justify-items: center; }
.empty svg { width: 34px; height: 34px; color: var(--muted); }
.empty h3 { margin: 0; font-size: 15px; }
.skeleton { height: 74px; border-radius: 13px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; border: 1px solid var(--line); }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

.foot { font-size: 10.5px; color: var(--muted); line-height: 1.5; }

/* alerts */
.alert-item { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.alert-item:last-child { border-bottom: 0; }
.alert-item .grow { flex: 1; min-width: 0; }
.alert-item .t { font-weight: 600; font-size: 12.5px; }
.pill { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.on { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch input:checked + span { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.switch input:checked + span::after { transform: translateX(16px); background: var(--accent); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.iconbtn { border: 0; background: none; color: var(--muted); padding: 6px; border-radius: 8px; display: inline-flex; }
.iconbtn svg { width: 16px; height: 16px; }
.iconbtn.del { color: var(--down); }

/* forms */
.field { display: grid; gap: 5px; }
.field label, .field .lab { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; font-size: 14px; min-width: 0; }
.field textarea { min-height: 120px; resize: vertical; font-family: var(--font-num); font-size: 12px; }
.field input[aria-invalid="true"] { border-color: var(--down); }
.field .err { color: var(--down); font-size: 11px; }
.field .hint { color: var(--muted); font-size: 11px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"].b { background: var(--up); color: var(--accent-ink); }
.seg button[aria-pressed="true"].s { background: var(--down); color: #fff; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 11px 12px; border-radius: 10px; background: var(--surface-2); }
.total .v { font-family: var(--font-num); font-weight: 600; font-size: 16px; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(2, 6, 23, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
@media (min-width: 620px) { .scrim { align-items: center; } .sheet { border-radius: 18px; padding-bottom: 18px; } }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet form { display: grid; gap: 12px; margin-top: 14px; }
.sheet .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.sheet .actions .spacer { flex: 1; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (min-width: 820px) { .toast { bottom: 28px; } }
.charts .shot { display: block; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 0; cursor: zoom-in; overflow: hidden; }
.charts .shot img { display: block; width: 100%; height: auto; }
.charts .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-top: 10px; }
.thumbs button { flex: none; width: 92px; border: 2px solid var(--line); border-radius: 9px; padding: 0; background: #fff; overflow: hidden; }
.thumbs button[aria-pressed="true"] { border-color: var(--accent); }
.thumbs img { display: block; width: 100%; height: 64px; object-fit: cover; object-position: top; }
.thumbs span { display: block; font-size: 9.5px; padding: 3px 4px; color: #334155; background: #f1f5f9; text-align: center; }
.viewer { position: fixed; inset: 0; z-index: 70; background: rgba(2, 6, 23, .92); display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.viewer .vbar { display: flex; justify-content: space-between; align-items: center; color: #e2e8f0; font-size: 12.5px; gap: 10px; }
.viewer .vimg { flex: 1; overflow: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
.viewer .vimg img { display: block; max-width: none; width: 100%; min-width: 600px; background: #fff; border-radius: 8px; }
@media (min-width: 900px) { .viewer .vimg img { width: auto; max-width: 100%; min-width: 0; margin: 0 auto; } }
a.btn { text-decoration: none; color: var(--fg); }
a.btn.primary { color: var(--accent-ink); }
</style>

<div class="app">

    <div class="brand">

<script>
"use strict";
/* ---------- constants & formatting ---------- */

const fmtInt = (n) => Math.round(n).toLocaleString("vi-VN");
const money = (n) => (n == null || !Number.isFinite(Number(n)) ? "—" : `${fmtInt(Number(n))} ₫`);

const fmtTime = (iso) => {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "—";
  return new Intl.DateTimeFormat("vi-VN", { timeZone: "Asia/Ho_Chi_Minh", hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(t));
};
const isUnit = (u) => u === "gram" || u === "chi" || u === "luong" || u === "kg";
const round4 = (n) => Math.round(n * 10000) / 10000;

function parseDate(date) {
  const m = String(date || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  const [, d, mo, y] = m.map(Number);
  const t = new Date(Date.UTC(y, mo - 1, d));
  if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) return null;
  return t.getTime();
}
const isoToVnDate = (iso) => { const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const vnDateToIso = (vn) => { const m = String(vn || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
const todayIso = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Ho_Chi_Minh" }).format(new Date());
/** Money: digits only (accepts 2.232.000 / 2,232,000 / 2232000). */
const parseMoney = (s) => { const d = String(s ?? "").replace(/[^\d]/g, ""); return d ? Number(d) : NaN; };
/** Decimal: accepts 1,5 or 1.5. */
const parseDec = (s) => { const t = String(s ?? "").trim().replace(/\s/g, ""); if (!t) return NaN; const n = Number(t.includes(",") && !t.includes(".") ? t.replace(",", ".") : t.replace(/,/g, "")); return n; };
function canonicalBrand(brand) {
  const b = String(brand || "").normalize("NFD").replace(/\p{Diacritic}/gu, "").trim().toLowerCase();
  if (!b || b.includes("phu quy")) return "phu-quy";
  return b;
}

/* ---------- portfolio math (same rules as the fixed app) ---------- */
function normalizedTrade(e) {
  const type = e.transactionType === "sell" ? "sell" : "buy";
  const unit = isUnit(e.unit) ? e.unit : "luong";
  const q = Number(e.quantity), w = Number(e.unitWeight), p = Number(e.pricePerUnit);
  if (q > 0 && w > 0 && p > 0) {
    return { type, grams: round4(q * w * GRAMS[unit]), amount: Math.round(q * w * p), fee: Math.max(0, Math.round(Number(e.feeVnd) || 0)), brand: (e.brand || "").trim() || LEGACY_BRAND };
  }
  const luong = Math.max(0, Number(e.soLuong) || 0);
  return { type: "buy", grams: round4(luong * GRAMS.luong), amount: Math.round(luong * Number(e.giaMua || 0)), fee: 0, brand: (e.brand || "").trim() || LEGACY_BRAND };
}
const orderKey = (a, b) => (parseDate(a.date) ?? 0) - (parseDate(b.date) ?? 0) || String(a.createdAt || "").localeCompare(String(b.createdAt || "")) || String(a._id).localeCompare(String(b._id));

function calculatePortfolio(txs, buyback) {
  let invested = 0, realized = 0, invalidSale = false;
  const inv = new Map();
  for (const e of [...txs].sort(orderKey)) {
    const t = normalizedTrade(e);
    if (t.grams <= 0) continue;
    const key = canonicalBrand(t.brand);
    const pos = inv.get(key) || { grams: 0, cost: 0 };
    if (t.type === "buy") {
      const c = t.amount + t.fee;
      invested += c;
      inv.set(key, { grams: pos.grams + t.grams, cost: pos.cost + c });
      continue;
    }
    if (t.grams > pos.grams + 0.0001) { invalidSale = true; continue; }
    const avg = pos.grams > 0 ? pos.cost / pos.grams : 0;
    const sold = Math.round(avg * t.grams);
    realized += (t.amount - t.fee) - sold;
    inv.set(key, { grams: Math.max(0, pos.grams - t.grams), cost: Math.max(0, pos.cost - sold) });
  }
  const vals = [...inv.values()];
  const grams = vals.reduce((s, x) => s + x.grams, 0);
  const cost = Math.round(vals.reduce((s, x) => s + x.cost, 0));
  const luong = grams / GRAMS.luong;
  const avgPerLuong = luong > 0 ? cost / luong : 0;
  const unpriced = [...inv.entries()].some(([k, p]) => p.grams > 0.0001 && k !== "phu-quy");
  const pricedGrams = inv.get("phu-quy")?.grams ?? 0;
  const value = buyback != null && !unpriced ? Math.round((pricedGrams / GRAMS.luong) * buyback) : null;
  const unrealized = value == null ? null : value - cost;
  const total = unrealized == null ? null : realized + unrealized;
  const totalPct = total == null || invested <= 0 ? null : (total / invested) * 100;
  const shortfall = buyback == null || luong <= 0 || unpriced ? null : avgPerLuong - buyback;
  const progress = shortfall == null || avgPerLuong <= 0 ? null : Math.min(1, buyback / avgPerLuong);
  const surpassed = shortfall != null && shortfall < 0 ? (Math.abs(shortfall) / avgPerLuong) * 100 : null;
  return { grams, luong, invested: Math.round(invested), cost, avgPerLuong, value, unrealized, realized: Math.round(realized), total, totalPct, unpriced, invalidSale, shortfall, progress, surpassed };
}

function saleWouldOverdraw(rows, incoming, excludeId) {
  const events = rows.filter((r) => r._id !== excludeId).map((r) => {
    const t = normalizedTrade(r);
    return { date: parseDate(r.date) ?? 0, created: String(r.createdAt || ""), type: t.type, grams: t.grams, brand: canonicalBrand(t.brand) };
  });
  const it = normalizedTrade(incoming);
  events.push({ date: parseDate(incoming.date) ?? 0, created: String(incoming.createdAt || new Date().toISOString()), type: it.type, grams: it.grams, brand: canonicalBrand(it.brand) });
  events.sort((a, b) => a.date - b.date || a.created.localeCompare(b.created));
  let total = 0; const byBrand = new Map();
  for (const ev of events) {
    const bb = byBrand.get(ev.brand) ?? 0;
    if (ev.type === "sell") {
      if (ev.grams > total + 0.0001 || ev.grams > bb + 0.0001) return true;
      total -= ev.grams; byBrand.set(ev.brand, bb - ev.grams);
    } else { total += ev.grams; byBrand.set(ev.brand, bb + ev.grams); }
  }
  return false;
}

function txInfo(e) {
  const unit = isUnit(e.unit) ? e.unit : "luong";
  const legacy = !(Number(e.quantity) > 0) || !(Number(e.unitWeight) > 0) || !(Number(e.pricePerUnit) > 0);
  const t = normalizedTrade(e);
  return {
    legacy, unit, grams: t.grams, amount: t.amount, fee: t.fee, kind: t.type,
    quantity: legacy ? Number(e.soLuong) : Number(e.quantity),
    weight: legacy ? 1 : Number(e.unitWeight),
    price: legacy ? Number(e.giaMua) : Number(e.pricePerUnit),
    missingBrand: legacy || !String(e.brand || "").trim(),
  };
}

function sparkline(history, field = "buy", fmtV = fmtInt, unit = " ₫", label = "giá thu mua") {
  const pts = (history || []).filter((h) => Number(h[field]) > 0 && Number.isFinite(Date.parse(h.at))).sort((a, b) => Date.parse(a.at) - Date.parse(b.at)).slice(-60);
  if (pts.length < 2) return `<p class="small muted" style="margin:12px 0 0">Biểu đồ diễn biến ${label} sẽ hiện khi có từ 2 lần cập nhật trở lên.</p>`;
  const W = 600, H = 64, P = 4;
  const vals = pts.map((p) => Number(p[field]));
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max - min || 1;
  const x = (i) => P + (i / (pts.length - 1)) * (W - 2 * P);
  const y = (v) => H - P - ((v - min) / span) * (H - 2 * P);
  const line = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${line}L${x(vals.length - 1).toFixed(1)},${H}L${x(0).toFixed(1)},${H}Z`;
  const last = vals[vals.length - 1];
  const chg = last - vals[0];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Diễn biến ${label} ${pts.length} lần cập nhật">
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(last)}" r="3.5" fill="var(--accent)"/>
  </svg>
  <div class="spark-axis"><span>${esc(fmtTime(pts[0].at))}</span><span class="${chg >= 0 ? "up" : "down"}">${chg >= 0 ? "+" : "−"}${fmtV(Math.abs(chg))}${unit} · thấp ${fmtV(min)} / cao ${fmtV(max)}</span></div>`;
}

function liveStatusHtml(m) {
  const fmtS = (t) => new Intl.DateTimeFormat("vi-VN", { timeZone: "Asia/Ho_Chi_Minh", hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date(t));
  const parts = [];
  if (m?.live?.world) parts.push(`<span class="dot ok"></span><span class="muted">Giá thế giới trực tiếp · kiểm tra ${fmtS(m.live.world.checked)} · mỗi 15 giây</span>`);
  else if (live.worldErr) parts.push(`<span class="dot warn"></span><span class="warn">Không đọc trực tiếp được giá thế giới, đang dùng giá GitHub (30 phút)</span>`);
  if (m?.live?.pq) parts.push(`<span class="dot ok"></span><span class="muted">Bảng giá Phú Quý trực tiếp · kiểm tra ${fmtS(m.live.pq.checked)} · mỗi phút</span>`);
  else if (live.pqErr) parts.push(`<span class="dot warn"></span><span class="warn">Không đọc trực tiếp được Phú Quý, đang dùng giá GitHub (30 phút)</span>`);
  return parts.map((p) => `<div class="status">${p}</div>`).join("");
}
function syncLine(m) {
  const liveHtml = liveStatusHtml(m);
  if (m?.live?.world && m?.live?.pq) return liveHtml;
  const t = Date.parse(m?.fetchedAt);
  if (!Number.isFinite(t)) return liveHtml;
  const ageH = (Date.now() - t) / 36e5;
  const late = ageH > 10;
  return liveHtml + `<div class="status"><span class="dot ${late ? "warn" : "ok"}"></span><span class="${late ? "warn" : "muted"}">${late ? "Chưa đồng bộ được từ" : "Kiểm tra giá lúc"} ${esc(fmtTime(m.fetchedAt))}</span><span class="muted">· kiểm tra mỗi 30 phút, 07:00–22:30</span></div>`;
}

function worldHero(m) {
  const w = m?.world;
  if (!w || !(Number(w.usdPerOz) > 0)) {
    if (state.marketStatus === "loading") return `<div class="skeleton" style="height:150px"></div>`;
    return `<div class="card world"><div class="eyebrow">Giá bạc thế giới · XAG/USD</div><div class="small warn" style="margin-top:8px;font-weight:600">Chưa thể cập nhật giá thế giới</div></div>`;
  }
  const chg = Number(w.changePct);
  const hasChg = Number.isFinite(chg) && w.changePct !== null && w.changePct !== undefined;
  const perLuong = Number(w.vndPerKg) > 0 ? (Number(w.vndPerKg) * GRAMS.luong) / 1000 : null;
  const t = target();
  const premium = perLuong && t && Number(t.buy) > 0 ? Number(t.buy) - perLuong : null;
  return `<div class="card world">
    <div class="row"><div class="eyebrow">Giá bạc thế giới · XAG/USD</div>${hasChg ? `<span class="pl-chip ${chg >= 0 ? "up" : "down"}">${chg >= 0 ? "▲ +" : "▼ −"}${Math.abs(chg).toFixed(2).replace(".", ",")}%</span>` : ""}</div>
    <div class="world-main"><span class="world-usd num">${usd2(w.usdPerOz)}</span><span class="world-unit">USD/oz</span></div>
    ${perLuong ? `<div class="world-vnd"><span class="num">≈ ${fmtInt(perLuong)}</span><span class="muted"> ₫/lượng</span><span class="tiny muted"> · ${fmtInt(w.vndPerKg)} ₫/kg</span></div>` : ""}
    <div class="status" style="margin-top:8px"><span class="muted">${esc(w.asOf ? "Cập nhật " + fmtTime(w.asOf) : "")}${w.source ? " · Nguồn: " + esc(w.source) : ""}</span></div>
    ${premium != null ? `<p class="tiny muted" style="margin:6px 0 0">Giá thu mua Phú Quý đang ${premium >= 0 ? "cao hơn" : "thấp hơn"} giá thế giới quy đổi <span class="num">${fmtInt(Math.abs(premium))} ₫/lượng</span>. ${esc(w.note || "Giá quy đổi trước thuế và phí nhập khẩu")}.</p>` : ""}
    ${sparkline(m.worldHistory, "usd", (v) => usd2(v), " USD", "giá thế giới")}
    <div style="margin-top:10px">${syncLine(m)}</div>
  </div>`;
}

const chartDay = (c) => (c.kind === "archive" && c.date ? c.date.split("-").reverse().join("/") : fmtTime(c.at));
function fileToJpeg(file, maxW = 1400, q = 0.82) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const draw = (w, qq) => {
        const sc = Math.min(1, w / img.naturalWidth);
        const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", qq);
      };
      // Firestore giới hạn 1 MB mỗi bản ghi: thu nhỏ dần nếu ảnh quá nặng.
      let out = draw(maxW, q);
      for (const [w, qq] of [[1200, 0.78], [1000, 0.74], [800, 0.7]]) { if (out.length <= 900_000) break; out = draw(w, qq); }
      URL.revokeObjectURL(url); resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Không đọc được ảnh")); };
    img.src = url;
  });
}
async function addChartFiles(files) {
  const imgs = [...files].filter((f) => f && f.type && f.type.startsWith("image/"));
  if (!imgs.length) return;
  let added = 0;
  for (const f of imgs) {
    try {
      const src = await fileToJpeg(f);
      const ref = chartCollection().doc();
      await ref.set({ at: new Date().toISOString(), note: "", src });
      added++;
    } catch (e) { toast(e?.code ? writeErrorText(e) : (e?.message || "Chưa lưu được ảnh.")); }
  }
  if (added) { charts.sel = null; toast(added > 1 ? `Đã lưu ${added} ảnh biểu đồ` : "Đã lưu ảnh biểu đồ"); render(); }
}

function txCard(e) {
  const i = txInfo(e);
  const sell = i.kind === "sell";
  const brand = (e.brand || "").trim();
  const detail = i.legacy
    ? `${fmtNum(e.soLuong)} lượng × ${money(e.giaMua)}`
    : `${fmtNum(i.quantity)} × ${fmtNum(i.weight)} ${UNIT_NAMES[i.unit]} · ${money(i.price)}/${UNIT_NAMES[i.unit]}`;
  const bb = buyback();
  let pl = "";
  let cls = "";
  if (!sell && bb != null && canonicalBrand(brand || LEGACY_BRAND) === "phu-quy") {
    const cost = i.amount + i.fee;
    const val = Math.round((i.grams / GRAMS.luong) * bb);
    const d = val - cost, pct = cost > 0 ? (d / cost) * 100 : 0, up = d >= 0;
    cls = up ? "gain" : "loss";
    pl = `<div class="pl-row"><span class="muted">Nếu bán hôm nay: <span class="num">${money(val)}</span></span><span style="display:flex;gap:6px;align-items:center"><span class="pl-val ${up ? "up" : "down"}">${signedMoney(d)}</span><span class="pl-chip ${up ? "up" : "down"}">${up ? "▲ +" : "▼ −"}${Math.abs(pct).toFixed(2).replace(".", ",")}%</span></span></div>`;
  } else if (!sell && bb == null) {
    pl = `<div class="pl-row"><span class="muted">Lời/lỗ</span><span class="warn tiny" style="font-weight:600">${PRICE_ERROR_LABEL}</span></div>`;
  } else if (!sell) {
    pl = `<div class="pl-row"><span class="muted">Lời/lỗ</span><span class="muted tiny">Chưa có giá thu mua cho thương hiệu này</span></div>`;
  }
  return `<button class="tx ${cls}" data-edit="${esc(e._id)}" aria-label="Sửa giao dịch ${sell ? "bán" : "mua"} ngày ${esc(e.date)}">
    <div class="tx-head"><span class="badge ${sell ? "sell" : "buy"}">${sell ? "BÁN" : "MUA"}</span><span class="tx-date num">${esc(e.date)}</span></div>
    <div class="tx-name">${esc(e.productName || "Bạc")}${brand ? ` · ${esc(brand)}` : ` · <span class="muted">${LEGACY_BRAND}</span>`}</div>
    <div class="tx-meta"><span>${fmtNum(i.grams)} g · ${fmtNum(i.grams / GRAMS.luong)} lượng</span><span class="amt">${money(i.amount)}</span></div>
    <div class="tx-sub">${detail}${i.fee > 0 ? ` · Phí ${money(i.fee)}` : ""}</div>
    ${e.note ? `<div class="tx-note">${esc(e.note)}</div>` : ""}

function buildTx(form) {
  const err = (m, sel) => { if (sel) $(sel).setAttribute("aria-invalid", "true"); return { error: m }; };
  form.querySelectorAll("[aria-invalid]").forEach((x) => x.removeAttribute("aria-invalid"));
  const iso = $("#f-date").value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return err("Chọn ngày giao dịch.", "#f-date");
  const date = isoToVnDate(iso);
  if (parseDate(date) == null) return err("Ngày không hợp lệ.", "#f-date");
  const brand = $("#f-brand").value.trim();
  if (!brand) return err("Nhập thương hiệu.", "#f-brand");
  const unit = $("#f-unit").value;
  const q = parseDec($("#f-qty").value);
  if (!(q > 0)) return err("Số lượng phải lớn hơn 0.", "#f-qty");
  const w = parseDec($("#f-weight").value);
  if (!(w > 0)) return err("Quy cách mỗi cái phải lớn hơn 0.", "#f-weight");
  const p = parseMoney($("#f-price").value);
  if (!(p > 0)) return err("Nhập đơn giá.", "#f-price");
  const feeRaw = $("#f-fee").value.trim();
  const fee = feeRaw ? parseMoney(feeRaw) : 0;
  if (!(fee >= 0)) return err("Phí không hợp lệ.", "#f-fee");
  const grams = q * w * GRAMS[unit];
  const giaMua = Math.round((p * GRAMS.luong) / (w * GRAMS[unit]));
  if (!Number.isSafeInteger(giaMua)) return err("Đơn giá quá lớn.", "#f-price");
  return {
    data: {
      date, transactionType: form.dataset.kind === "sell" ? "sell" : "buy",
      brand: brand === LEGACY_BRAND ? "Phú Quý" : brand,
      productName: $("#f-product").value.trim() || "Bạc",
      unit, unitWeight: round4(w), quantity: round4(q), pricePerUnit: p, feeVnd: fee,
      note: $("#f-note").value.trim(),
      soLuong: round4(grams / GRAMS.luong), giaMua,
    },
  };
}

async function saveTxFromForm(form, entry) {
  const r = buildTx(form);
  if (r.error) { $("#f-err").textContent = r.error; return; }
  const now = new Date().toISOString();
  const body = { ...r.data, createdAt: entry?.createdAt || now, updatedAt: now };
  if (entry?.legacyId != null) body.legacyId = entry.legacyId;
  if (body.transactionType === "sell" || entry) {
    if (saleWouldOverdraw(state.tx, body, entry?._id)) { $("#f-err").textContent = "Số bạc bán vượt quá khối lượng đang sở hữu tại ngày giao dịch."; return; }
  }
  const btn = $("#f-save"); btn.disabled = true;
  try {
    const col = txCollection();
    await (entry ? col.doc(entry._id) : col.doc()).set(body);
    closeSheet(); toast(entry ? "Đã lưu giao dịch" : "Đã thêm giao dịch");
  } catch (e) {
    btn.disabled = false;
    $("#f-err").textContent = writeErrorText(e);
  }
}

function writeErrorText(e) {
  const c = e?.code;
  if (c === "invalid_argument") return "Bạn không có quyền ghi dữ liệu ở trang này.";
  if (c === "quota_exceeded") return "Bộ nhớ dữ liệu đã đầy. Xóa bớt giao dịch cũ rồi thử lại.";
  if (c === "resource_exhausted") return "Thao tác quá nhanh. Đợi vài giây rồi thử lại.";
  return "Chưa lưu được. Kiểm tra kết nối rồi thử lại.";
}

function parseBackup(list) {
  const rows = []; let skipped = 0;
  for (const o of list) {
    if (!o || typeof o !== "object" || parseDate(o.date) == null) { skipped++; continue; }
    const { id, _id, ...body } = o;
    const t = normalizedTrade(body);
    if (!(t.grams > 0)) { skipped++; continue; }
    rows.push({ ...body, docId: String(id || _id || `import-${rows.length}-${Date.now()}`).replace(/[^A-Za-z0-9_\-.~:@+]/g, "-") });
  }
  if (!rows.length) return { error: "Tệp sao lưu không có giao dịch hợp lệ." };
  return { rows, legacy: 0, skipped };
}
function parseImport(raw) {
  let data;
  try { data = JSON.parse(raw); } catch { return { error: "Dữ liệu không phải JSON hợp lệ. Hãy sao chép toàn bộ, bắt đầu bằng [ và kết thúc bằng ]." }; }
  if (data && !Array.isArray(data) && data.app === "silver-tracker" && Array.isArray(data.transactions)) return parseBackup(data.transactions);
  if (!Array.isArray(data) && data && typeof data === "object") data = data.json_agg || data.rows || data.data || data.entries || Object.values(data).find(Array.isArray);
  if (Array.isArray(data) && data.length === 1 && Array.isArray(data[0]?.json_agg)) data = data[0].json_agg;
  if (!Array.isArray(data)) return { error: "Không tìm thấy danh sách giao dịch trong dữ liệu." };
  const pick = (o, ...ks) => { for (const k of ks) if (o[k] !== undefined && o[k] !== null && o[k] !== "") return o[k]; return undefined; };
  const rows = []; let legacy = 0, skipped = 0;
  for (const o of data) {
    if (!o || typeof o !== "object") { skipped++; continue; }
    const date = String(pick(o, "date") ?? "").trim();
    const soLuong = Number(pick(o, "soLuong", "so_luong"));
    const giaMua = Number(pick(o, "giaMua", "gia_mua"));
    if (parseDate(date) == null || !(soLuong > 0) || !(giaMua > 0)) { skipped++; continue; }
    const id = pick(o, "id");
    const q = Number(pick(o, "quantity")), w = Number(pick(o, "unitWeight", "unit_weight")), p = Number(pick(o, "pricePerUnit", "price_per_unit"));
    const unitRaw = pick(o, "unit");
    const isNew = q > 0 && w > 0 && p > 0;
    if (!isNew) legacy++;
    const createdRaw = pick(o, "createdAt", "created_at");
    const createdAt = Number.isFinite(Date.parse(createdRaw)) ? new Date(Date.parse(createdRaw)).toISOString() : new Date().toISOString();
    rows.push({
      docId: id != null && /^\d+$/.test(String(id)) ? `legacy-${id}` : `import-${date.replace(/\//g, "")}-${rows.length}-${Math.round(soLuong * 10000)}`,
      legacyId: id != null && /^\d+$/.test(String(id)) ? Number(id) : null,
      date, note: String(pick(o, "note") ?? ""), createdAt, updatedAt: new Date().toISOString(),
      soLuong: round4(soLuong), giaMua: Math.round(giaMua),
      transactionType: isNew && pick(o, "transactionType", "transaction_type") === "sell" ? "sell" : "buy",
      brand: String(pick(o, "brand") ?? ""),
      productName: String(pick(o, "productName", "product_name") ?? ""),
      unit: isNew && isUnit(unitRaw) ? unitRaw : "luong",
      unitWeight: isNew ? round4(w) : 1,
      quantity: isNew ? round4(q) : round4(soLuong),
      pricePerUnit: isNew ? p : Math.round(giaMua),
      feeVnd: isNew ? Math.max(0, Math.round(Number(pick(o, "feeVnd", "fee_vnd")) || 0)) : 0,
    });
  }
  if (!rows.length) return { error: "Không có dòng nào đủ ngày (dd/mm/yyyy), số lượng và giá mua." };
  return { rows, legacy, skipped };
}

/** Mutates p; returns true when something changed. */
function evaluateAlertsInto(p, force) {
  const t = target();
  if (buyback() == null) return false;
  const key = priceKey();
  if (!force && p.lastEvaluatedKey === key) return false;
  let changed = p.lastEvaluatedKey !== key;
  p.lastEvaluatedKey = key;
  const now = new Date().toISOString();
  for (const a of p.alerts) {
    const k = ALERT_KINDS[a.kind];
    if (!k || !a.enabled) continue;
    const val = k.field === "world" ? Number(worldUsd()) : Number(t[k.field]);
    if (!(val > 0)) continue;
    const hit = k.dir > 0 ? val >= a.threshold : val <= a.threshold;
    if (hit && !a.triggered) {
      a.triggered = true; a.lastTriggeredAt = now; changed = true;
      const fv = (n) => (k.field === "world" ? fmtUsd(n) : `${fmtInt(n)} ₫`);
      p.history.unshift({ at: now, alertId: a.id, message: `${k.field === "buy" ? "Giá thu mua" : k.field === "sell" ? "Giá bán ra" : "Giá thế giới"} ${fv(val)} đã ${k.dir > 0 ? "chạm hoặc vượt" : "chạm hoặc xuống dưới"} ${fv(a.threshold)}` });
    } else if (!hit && a.triggered) { a.triggered = false; changed = true; }
  }
  p.history = p.history.slice(0, 50);
  return changed;
}

/* ---------- data wiring (GitHub Pages) ----------
   Giá thị trường: đọc data/market.json (GitHub Actions cập nhật).
   Giao dịch & cảnh báo: lưu trong trình duyệt này (localStorage), không gửi đi đâu. */
const LS_KEY = "silver-tracker-v1";
const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch { return {}; } };
const lsWrite = (o) => {
  try { localStorage.setItem(LS_KEY, JSON.stringify(o)); }
  catch (e) { const err = new Error("storage"); err.code = e?.name === "QuotaExceededError" ? "quota_exceeded" : "storage_blocked"; throw err; }
};
const lsListeners = new Set();
const lsNotify = () => { for (const fn of lsListeners) { try { fn(); } catch {} } };
window.addEventListener("storage", (e) => { if (e.key === LS_KEY) lsNotify(); });
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const snapDoc = (id, data) => ({ id, exists: data != null, data: () => (data == null ? undefined : JSON.parse(JSON.stringify(data))) });

function localDoc(path) {
  return {
    async set(data) { const s = lsRead(); s[path] = JSON.parse(JSON.stringify(data)); lsWrite(s); lsNotify(); },
    async delete() { const s = lsRead(); delete s[path]; lsWrite(s); lsNotify(); },
    onSnapshot(cb, _err) { const fn = () => cb(snapDoc(path.split("/").pop(), lsRead()[path])); lsListeners.add(fn); fn(); return () => lsListeners.delete(fn); },
    collection(name) { return localCollection(`${path}/${name}`); },
  };
}
function localCollection(path) {
  return {
    doc(id) { return localDoc(`${path}/${id || newId()}`); },
    onSnapshot(cb, _err) {
      const fn = () => {
        const s = lsRead(), pre = path + "/";
        const docs = Object.keys(s).filter((k) => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map((k) => snapDoc(k.slice(pre.length), s[k]));
        cb({ docs });
      };
      lsListeners.add(fn); fn(); return () => lsListeners.delete(fn);
    },
  };
}
const localDb = { doc: localDoc };
db = localDb;
const profileRef = () => db.doc(`data/users/${state.uid}/profile`);
const txCollection = () => profileRef().collection("tx");

const PROXIES = [
  (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,

];

async function fetchWithTimeout(url, ms = 9000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { cache: "no-store", signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.text(); }
  finally { clearTimeout(t); }
}
/** Try the remembered route first, then direct, then each public CORS proxy. */
async function fetchSmart(key, url) {
  const tries = [];
  if (route[key] !== undefined) tries.push(route[key]);
  for (const r of ["direct", 0, 1]) if (!tries.includes(r)) tries.push(r);
  let lastErr;
  for (const r of tries) {
    try {
      const txt = await fetchWithTimeout(r === "direct" ? url : PROXIES[r](url));
      route[key] = r; return { txt, via: r === "direct" ? "trực tiếp" : "qua máy chủ trung chuyển" };
    } catch (e) { lastErr = e; }
  }
  delete route[key]; throw lastErr || new Error("không đọc được");
}

async function pollWorld() {
  if (document.hidden) return;
  try {
    const { txt, via } = await fetchSmart("sq", SQ_URL);
    const arr = JSON.parse(txt);
    const feed = arr.find((x) => x?.spreadProfilePrices?.length) || arr[0];
    const pr = feed.spreadProfilePrices.find((x) => x.spreadProfile === "prime") || feed.spreadProfilePrices[0];
    const bid = Number(pr.bid), ask = Number(pr.ask), ts = Number(feed.ts);
    if (!(bid > 5 && bid < 500)) throw new Error("giá bất thường");
    live.world = { bid, ask, at: Number.isFinite(ts) && ts > 0 ? new Date(ts).toISOString() : new Date().toISOString(), via, checked: Date.now() };
    live.worldErr = null;
  } catch (e) { live.worldErr = String(e?.message || e); }
  applyMarket();
}

function parsePhuQuy(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const items = [];
  doc.querySelectorAll("tr").forEach((tr) => {
    const tds = tr.querySelectorAll("td"); if (tds.length < 2) return;
    const type = tds[0].textContent.replace(/\s+/g, " ").trim();
    const b = tr.querySelector(".silver-buy-price")?.textContent.trim(), se = tr.querySelector(".silver-sell-price")?.textContent.trim();
    if (!type || !b) return;
    const unit = tds[1].textContent.replace(/\s+/g, " ").trim();
    items.push({ type, unit: /VN/i.test(unit) ? unit : "", buy: parseMoney(b), sell: se && parseMoney(se) > 0 ? parseMoney(se) : null });
  });
  const tgt = items.find((i) => i.type.toUpperCase().includes("BẠC MIẾNG PHÚ QUÝ 999 1 LƯỢNG"));
  if (!tgt || !(tgt.buy > 500000 && tgt.buy < 20000000)) throw new Error("không thấy giá bạc miếng 1 lượng");
  const text = (doc.body?.textContent || "").replace(/\s+/g, " ");
  const m = text.match(/(\d{1,2}):(\d{2})\s*(?:ngày\s*)?(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  const p2 = (n) => String(n).padStart(2, "0");
  const asOf = m ? `${m[5]}-${p2(m[4])}-${p2(m[3])}T${p2(m[1])}:${m[2]}:00+07:00` : null;
  const ref = text.match(/([\d.,]+)\s*USD\s*\/\s*OUNCE\s*≈\s*([\d.,]+)\s*VNĐ\s*\/\s*KG/i);
  return { items, target: { name: "BẠC MIẾNG PHÚ QUÝ 999 1 LƯỢNG", buy: tgt.buy, sell: tgt.sell }, asOf,
    refUsd: ref ? Number(ref[1].replace(/,/g, "")) : null, refVndKg: ref ? parseMoney(ref[2]) : null };
}
async function pollPhuQuy() {
  if (document.hidden) return;
  try {
    const { txt, via } = await fetchSmart("pq", PQ_URL);
    live.pq = { ...parsePhuQuy(txt), via, checked: Date.now() };
    live.pqErr = null;
  } catch (e) { live.pqErr = String(e?.message || e); }
  applyMarket();
}

async function loadMarket() {
  try {
    const r = await fetch(MARKET_JSON(), { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    base = await r.json();
  } catch { /* keep previous snapshot */ }
  applyMarket();
}

/** Merge the GitHub snapshot with whatever live data is fresher. */
function applyMarket() {
  if (!base && !live.pq) { if (state.marketStatus === "loading" && live.pqErr) state.marketStatus = "error"; render(); return; }
  const m = JSON.parse(JSON.stringify(base || {}));
  m.history = Array.isArray(m.history) ? m.history : [];
  m.worldHistory = Array.isArray(m.worldHistory) ? m.worldHistory : [];
  m.live = { pq: null, world: null };
  const pq = live.pq;
  if (pq && (!m.priceAsOf || !pq.asOf || Date.parse(pq.asOf) >= Date.parse(m.priceAsOf))) {
    m.target = pq.target; m.items = pq.items;
    if (pq.asOf) { m.priceAsOf = pq.asOf; m.itemsAsOf = pq.asOf; }
    m.source = "phuquy";
    const last = m.history[m.history.length - 1];
    if (!last || last.buy !== pq.target.buy || last.sell !== pq.target.sell) m.history.push({ at: pq.asOf || new Date().toISOString(), buy: pq.target.buy, sell: pq.target.sell });
    m.live.pq = { via: pq.via, checked: pq.checked };
  }
  const w = live.world;
  if (w) {
    const prev = m.world || {};
    // VND conversion: Phú Quý's own reference rate (VNĐ per USD/oz), from the live board or the snapshot.
    let perOz = pq && pq.refUsd > 0 && pq.refVndKg > 0 ? pq.refVndKg / pq.refUsd : (Number(prev.usdPerOz) > 0 && Number(prev.vndPerKg) > 0 ? Number(prev.vndPerKg) / Number(prev.usdPerOz) : null);
    // Daily change: anchor to the previous close implied by the snapshot's change %.
    let changePct = null;
    if (Number(prev.usdPerOz) > 0 && Number.isFinite(Number(prev.changePct)) && prev.changePct !== null) {
      const prevClose = Number(prev.usdPerOz) / (1 + Number(prev.changePct) / 100);
      changePct = ((w.bid - prevClose) / prevClose) * 100;
    }
    m.world = { ...prev, usdPerOz: Math.round(w.bid * 100) / 100, ask: w.ask, changePct, asOf: w.at,
      source: `Swissquote (bid, ${w.via})`, vndPerKg: perOz ? Math.round(w.bid * perOz) : prev.vndPerKg,
      note: perOz ? `Quy đổi theo tỷ giá Phú Quý dùng cho giá tham chiếu (≈${fmtInt(perOz / 32.1507466)} ₫/USD), trước thuế và phí nhập khẩu` : prev.note };
    const lw = m.worldHistory[m.worldHistory.length - 1];
    if (!lw || Math.abs(lw.usd - m.world.usdPerOz) >= 0.01) m.worldHistory.push({ at: w.at, usd: m.world.usdPerOz });
    m.live.world = { via: w.via, checked: w.checked };
  }
  state.market = m;
  state.marketStatus = Number(m?.target?.buy) > 0 ? "ready" : "missing";
  maybeEvaluateAlerts(); render();
}

function subscribeMarket() {
  loadMarket(); pollWorld(); pollPhuQuy();
  marketTimers.forEach(clearInterval);
  marketTimers = [setInterval(loadMarket, JSON_EVERY), setInterval(pollWorld, WORLD_EVERY), setInterval(pollPhuQuy, PQ_EVERY)];
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { pollWorld(); pollPhuQuy(); loadMarket(); } });
}
function subscribeProfile() {
  if (unsubProfile) unsubProfile();
  unsubProfile = profileRef().onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : {};
    state.profile = { alerts: Array.isArray(d.alerts) ? d.alerts : [], history: Array.isArray(d.history) ? d.history : [], lastEvaluatedKey: d.lastEvaluatedKey || null };
    state.profileLoaded = true;
    maybeEvaluateAlerts(); render();
  }, () => { state.profileLoaded = true; render(); });
}

const localDownloads = {
  async save({ filename, data }) {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
};

/* ---------- đồng bộ theo tài khoản Google (Firebase) ----------
   Bật khi repo có tệp firebase-config.js. Không có tệp → chạy như cũ (lưu trong trình duyệt). */
const FB_VER = "10.12.2";
const fbConfig = () => {
  try { if (typeof firebaseConfig !== "undefined" && firebaseConfig?.apiKey) return firebaseConfig; } catch {}
  return window.FIREBASE_CONFIG?.apiKey ? window.FIREBASE_CONFIG : null;
};
const loadScript = (src) => new Promise((ok, bad) => {
  const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => bad(new Error(src));
  document.head.appendChild(el);
});
const settle = (p, ms = 2500) => {
  // Firestore ghi vào máy ngay rồi gửi lên sau; khi mất mạng thì không chờ server trả lời.
  p.catch((e) => toast(writeErrorText(e)));
  return Promise.race([p, new Promise((r) => setTimeout(r, ms))]);
};
const wrapSnap = (s) => ({ id: s.id, exists: s.exists, data: () => s.data() });
function cloudDoc(ref) {
  return {
    set: (data) => settle(ref.set(JSON.parse(JSON.stringify(data)))),
    delete: () => settle(ref.delete()),
    onSnapshot: (cb, err) => ref.onSnapshot((s) => cb(wrapSnap(s)), err),
    collection: (name) => cloudCollection(ref.collection(name)),
  };
}
function cloudCollection(ref) {
  return {
    doc: (id) => cloudDoc(id ? ref.doc(id) : ref.doc()),
    onSnapshot: (cb, err) => ref.onSnapshot((s) => cb({ docs: s.docs.map(wrapSnap) }), err),
  };
}

function startData() {
  render();
  subscribeCharts();
  subscribeNotify();
  subscribeTx();
  subscribeProfile();
}
function useLocal() {
  db = localDb; state.uid = "local"; state.user = null;
  startData();
}
async function useCloud(user) {
  const fs = firebase.firestore();
  db = { doc: (p) => cloudDoc(fs.doc(p)) };
  state.uid = user.uid; state.user = { email: user.email, displayName: user.displayName, photoURL: user.photoURL };
  const moved = await migrateLocal(fs, user.uid);
  migrateLocalCharts(fs, user.uid);
  startData();
  return moved;
}
async function migrateLocalCharts(fs, uid) {
  const s = lsRead(), pre = "data/users/local/profile/charts/";
  const keys = Object.keys(s).filter((k) => k.startsWith(pre) && !k.slice(pre.length).includes("/"));
  for (const k of keys) {
    try {
      const ref = fs.doc(`data/users/${uid}/profile`).collection("charts").doc(k.slice(pre.length));
      if (!(await ref.get()).exists) await ref.set(JSON.parse(JSON.stringify(s[k])));
    } catch { /* thử lại ở lần đăng nhập sau */ }
  }
}
// Lần đầu đăng nhập: tài khoản chưa có giao dịch → tự chuyển giao dịch đang có trong máy lên.
async function migrateLocal(fs, uid) {
  const s = lsRead(), pre = "data/users/local/profile/tx/";
  const local = Object.keys(s).filter((k) => k.startsWith(pre) && !k.slice(pre.length).includes("/"));
  const localProfile = s["data/users/local/profile"];
  if (!local.length && !localProfile?.alerts?.length) return 0;
  try {
    const base = fs.doc(`data/users/${uid}/profile`);
    const [txSnap, profSnap] = await Promise.all([base.collection("tx").limit(1).get(), base.get()]);
    let moved = 0;
    if (txSnap.empty && local.length) {
      for (let i = 0; i < local.length; i += 400) {
        const batch = fs.batch();
        for (const k of local.slice(i, i + 400)) { batch.set(base.collection("tx").doc(k.slice(pre.length)), JSON.parse(JSON.stringify(s[k]))); moved++; }
        await batch.commit();
      }
    }
    if (!profSnap.exists && localProfile?.alerts?.length) await base.set(JSON.parse(JSON.stringify(localProfile)));
    return moved;
  } catch { toast("Chưa chuyển được giao dịch trong máy lên tài khoản. Có thể dùng “Nhập từ app cũ”."); return -1; }
}

async function signIn() {
  if (!window.firebase?.auth) { toast("Chưa tải được đăng nhập. Kiểm tra mạng rồi thử lại."); return; }
  const auth = firebase.auth(), provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try { await auth.signInWithPopup(provider); }
  catch (e) {
    const c = e?.code || "";
    if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment" || c === "auth/web-storage-unsupported") {
      try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
    }
    if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return;
    if (c === "auth/unauthorized-domain") toast("Tên miền chưa được cho phép trong Firebase (Authentication → Settings → Authorized domains).");
    else toast("Chưa đăng nhập được. Thử lại sau.");
  }
}
function accountSheet() {
  const u = state.user || {};
  openSheet(`<h3 id="sheet-title">Tài khoản đồng bộ</h3>
    <p class="small muted" style="margin:6px 0 0">Đang đăng nhập: <b>${esc(u.email || u.displayName || "")}</b>. Giao dịch và cảnh báo tự đồng bộ trên mọi máy đăng nhập cùng tài khoản.</p>
    <p class="small muted" style="margin:6px 0 0">Đăng xuất chỉ ngắt đồng bộ trên máy này, dữ liệu trên tài khoản vẫn còn nguyên.</p>
    <div class="actions"><button class="btn" data-action="close">Đóng</button><button class="btn danger" data-action="signout">Đăng xuất</button></div>`, "[data-action=close]");
}

async function startCloud(cfg) {
  state.cloud = "loading"; render();
  try {
    for (const m of ["app", "auth", "firestore"]) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
    firebase.initializeApp(cfg);
    const fs = firebase.firestore();
    try { fs.settings({ ignoreUndefinedProperties: true, merge: true }); } catch {}
    try { await fs.enablePersistence({ synchronizeTabs: true }); } catch {}
    firebase.auth().getRedirectResult().catch(() => {});
  } catch {
    state.cloud = "off"; useLocal(); toast("Không tải được đồng bộ, đang dùng dữ liệu trong máy."); return;
  }
  let first = true;
  firebase.auth().onAuthStateChanged(async (user) => {
    const was = state.uid;
    if (user) {
      if (was === user.uid) return;
      state.cloud = "signedin"; state.txStatus = "loading"; state.profileLoaded = false;
      const moved = await useCloud(user);
      if (moved > 0) toast(`Đã đăng nhập và chuyển ${moved} giao dịch từ máy này lên tài khoản`);
      else if (!first && moved === 0) toast(`Đã đăng nhập · ${user.email || ""}`);
    } else {
      state.cloud = "signedout";
      if (was !== "local") useLocal(); else render();
      if (!first && was && was !== "local") toast("Đã đăng xuất. Dữ liệu trên tài khoản vẫn còn.");
    }
    first = false;
  });
}

async function boot() {
  try { const saved = localStorage.getItem("st-tab"); if (["market", "portfolio", "alerts"].includes(saved)) state.tab = saved; } catch {}
  if (location.hash === "#danh-muc") state.tab = "portfolio";
  if (location.hash === "#canh-bao") state.tab = "alerts";
  state.boot = "ready";
  state.downloads = localDownloads;
  state.canEditMarket = false;
  subscribeMarket();
  loadChartArchive();
  loadNotifyPublic();
  const cfg = location.protocol.startsWith("http") ? fbConfig() : null;
  if (cfg) startCloud(cfg);
  else useLocal();
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; try { localStorage.setItem("st-tab", state.tab); } catch {} render(); window.scrollTo(0, 0); return; }
  const go = e.target.closest("[data-goto]");
  if (go) { state.tab = go.dataset.goto; render(); window.scrollTo(0, 0); return; }
  const f = e.target.closest("[data-filter]");
  if (f) { state.filter = f.dataset.filter; render(); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { const entry = state.tx.find((x) => x._id === ed.dataset.edit); if (entry) txForm(entry); return; }
  const delA = e.target.closest("[data-del-alert]");
  if (delA) {
    const next = cloneProfile(); next.alerts = next.alerts.filter((a) => a.id !== delA.dataset.delAlert);
    writeProfile(next).then(() => toast("Đã xóa cảnh báo"), (err) => toast(writeErrorText(err))); return;
  }
  const act = e.target.closest("[data-action]");
  if (!act) return;
  const a = act.dataset.action;
  if (a === "close") closeSheet();
  else if (a === "add") txForm(null);
  else if (a === "price") priceForm();
  else if (a === "import") importForm();
  else if (a === "export") exportJson();
  else if (a === "retry-tx") subscribeTx();
  else if (a === "signin") signIn();
  else if (a === "account") { if (state.cloud === "signedin") accountSheet(); else signIn(); }
  else if (a === "signout") { closeSheet(); firebase.auth().signOut().catch(() => {}); }
  else if (a === "add-alert") alertForm(null);
  else if (a === "notify-settings") notifySettingsForm();
  else if (a === "alert-breakeven") alertForm({ kind: "buy_above", threshold: Math.round(calculatePortfolio(state.tx, buyback()).avgPerLuong) });
  else if (a === "ask-delete") { const id = $("#tx-form")?.dataset.id; const entry = state.tx.find((x) => x._id === id); if (entry) askDelete(entry); }
});
document.addEventListener("change", (e) => {
  const tg = e.target.closest("[data-toggle-alert]");
  if (!tg) return;
  const next = cloneProfile();
  const al = next.alerts.find((x) => x.id === tg.dataset.toggleAlert);
  if (!al) return;
  al.enabled = tg.checked; if (!al.enabled) al.triggered = false;
  evaluateAlertsInto(next, true);
  writeProfile(next).catch((err) => toast(writeErrorText(err)));
});

boot();
</script>
