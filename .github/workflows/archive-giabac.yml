name: Lưu trữ biểu đồ giabac.vn

on:
  schedule:
    # 17:05 giờ Việt Nam mỗi ngày (10:05 UTC), sau phiên niêm yết chiều của Phú Quý
    - cron: "5 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: archive-giabac
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài trình duyệt
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Chụp biểu đồ và lưu dữ liệu
        run: node scripts/archive_giabac.mjs

      - name: Lưu vào repo
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- archive)" ]; then
            echo "Không có gì mới."; exit 0
          fi
          git config user.name "silver-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "Lưu trữ biểu đồ giabac.vn $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
