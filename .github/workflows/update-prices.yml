name: Cập nhật giá bạc

on:
  schedule:
    # Mỗi lượt chạy liền ~5,5 giờ, kiểm tra giá mỗi phút, rồi TỰ khởi động lượt kế tiếp (không chờ lịch GitHub).
    # Lịch dưới đây chỉ là dự phòng/khởi động buổi sáng; nếu đang có lượt chạy thì lượt mới chỉ xếp hàng.
    - cron: "7,37 0-15 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Gửi tin nhắn Telegram (và báo động ntfy nếu bật) thử nghiệm"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # Chỉ một vòng lặp chạy tại một thời điểm; gửi thử không phải chờ vòng lặp.
  group: update-prices-${{ inputs.test_notify && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LOOP_MINUTES: ${{ inputs.test_notify && '0' || '330' }}
      EVERY_SECONDS: "60"
      COMMIT_EVERY_SECONDS: "720"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gửi thử thông báo
        if: inputs.test_notify
        env:
          NOTIFY_TEST: "1"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Chưa cài khoá trong GitHub Secrets."; exit 0; fi
          pip install --quiet --disable-pip-version-check firebase-admin==6.5.0
          python scripts/update_prices.py || true
          python scripts/check_alerts.py

      - name: Lấy giá, kiểm tra cảnh báo (lặp mỗi phút), lưu vào repo
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "silver-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ALERTS=1
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Chưa cài khoá Telegram/Firebase trong GitHub Secrets → chỉ cập nhật giá."; ALERTS=0
          else
            pip install --quiet --disable-pip-version-check firebase-admin==6.5.0
          fi
          save() {
            if [ -z "$(git status --porcelain -- data/market.json data/notify.json data/notify-log.json archive)" ]; then return 0; fi
            git add data/market.json archive
            [ -f data/notify.json ] && git add data/notify.json
            [ -f data/notify-log.json ] && git add data/notify-log.json
            git commit -q -m "Cập nhật giá bạc $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')"
            for i in 1 2 3; do
              git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q && return 0
              sleep 5
            done
            echo "Không đẩy được lên repo lần này, sẽ thử lại."
          }
          start=$(date +%s); last_save=0
          while :; do
            python scripts/update_prices.py || echo "Lấy giá lỗi, thử lại sau."
            [ "$ALERTS" = 1 ] && { python scripts/check_alerts.py || true; }
            now=$(date +%s)
            if [ $((now - last_save)) -ge "$COMMIT_EVERY_SECONDS" ]; then save; last_save=$now; fi
            # Dừng sau LOOP_MINUTES phút, hoặc sau 22:50 giờ Việt Nam.
            vn=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
            if [ $((now - start + EVERY_SECONDS)) -ge $((LOOP_MINUTES * 60)) ] || [ "$vn" -ge 2250 ]; then break; fi
            sleep "$EVERY_SECONDS"
          done
          save

      - name: Tự khởi động lượt kế tiếp
        if: ${{ !inputs.test_notify && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vn=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          if [ "$vn" -ge 2250 ] || [ "$vn" -lt 0650 ]; then echo "Ngoài giờ kiểm tra, dừng tới sáng."; exit 0; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/update-prices.yml/dispatches" -f ref="${GITHUB_REF_NAME}" \
            && echo "Đã khởi động lượt kế tiếp." || echo "Không tự khởi động được; lịch dự phòng sẽ chạy."
