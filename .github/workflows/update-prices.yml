name: Cập nhật giá bạc

on:
  schedule:
    # Mỗi 15 phút, từ 07:00 đến 22:45 giờ Việt Nam (00:00–15:45 UTC). GitHub có thể chạy trễ vài phút.
    - cron: "*/15 0-15 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Gửi tin nhắn Telegram (và báo động ntfy nếu bật) thử nghiệm"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lấy giá mới
        run: python scripts/update_prices.py

      - name: Kiểm tra cảnh báo, gửi Telegram / báo động ntfy
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTIFY_TEST: ${{ inputs.test_notify && '1' || '' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Chưa cài khoá Telegram/Firebase trong GitHub Secrets → bỏ qua cảnh báo."; exit 0
          fi
          pip install --quiet --disable-pip-version-check firebase-admin==6.5.0
          python scripts/check_alerts.py

      - name: Lưu vào repo nếu giá thay đổi
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/market.json data/notify.json data/notify-log.json archive)" ]; then
            echo "Không có thay đổi."; exit 0
          fi
          git config user.name "silver-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json archive
          [ -f data/notify.json ] && git add data/notify.json
          [ -f data/notify-log.json ] && git add data/notify-log.json
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git commit -m "Cập nhật giá bạc $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')"
          git push
